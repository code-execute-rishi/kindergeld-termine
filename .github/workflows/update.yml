# Daily: pull the official payment dates from the Bundesagentur, publish termine.json + the website.
# A failed run (BA changed its page, a check rejected the data) emails the repo owner; nothing is published then.
name: update

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the parser
        run: cd tools && python3 test_update_termine.py

      - name: Fetch dates (and refresh the date table on the website)
        run: |
          python3 tools/update_termine.py
          python3 tools/build_site.py   # also drops last year's table on 1 January

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Update payment dates"; git push; }

      # The Kindergeld amount is set by law and is not on the BA page in a machine-readable form.
      - name: Open an issue if next year's amount is missing (December only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$(( $(date +%Y) + 1 ))
          if [ "$(date +%m)" = "12" ] && ! python3 -c "import json,sys; sys.exit(0 if '$next' in json.load(open('Shared/termine.json'))['amountPerChildCents'] else 1)"; then
            title="Kindergeld amount for $next missing"
            gh issue list --state open --search "$title in:title" --json number --jq length | grep -qx 0 && \
              gh issue create --title "$title" --body "Add \"$next\": <cents> to amountPerChildCents in Shared/termine.json and docs/termine.json (bump version), or run tools/update_termine.py locally after editing Shared/termine.json. Until then the app shows the $(( next - 1 )) amount marked as not yet confirmed." || true
          fi

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
